# Lil guy's world: a Worker on lilguy.gokkehub.com with one KV namespace.
# It only claims the lilguy subdomain and touches nothing else on the zone.
name = "lil-guy-world"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [{ pattern = "lilguy.gokkehub.com", custom_domain = true }]

[[kv_namespaces]]
binding = "LILGUY"
id = "c1a775e20c3d463cbd2ee48d990687f2"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/app.js", "**/world.json"]
fallthrough = true

# His email. MAIL_ADDRESS is his address. FORWARD_TO (Frederik's inbox) and MAIL_ALLOWED_TO are set
# on the Worker in Cloudflare, not here, so no personal address lives in the repo.
[vars]
MAIL_ADDRESS = "lilguy@gokkehub.com"

# Sends from his address. On the free plan Cloudflare only delivers to verified addresses (Frederik).
[[send_email]]
name = "EMAIL"
